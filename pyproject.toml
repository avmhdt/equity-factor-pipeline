[project]
name = "efp"
version = "0.1.0"
description = "Cross-sectional equity factor research pipeline on a point-in-time US equity data layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "eqpit",
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "statsmodels>=0.14.2",
    "linearmodels>=6.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "structlog>=24.1",
]

[project.scripts]
efp = "efp.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efp"]

[tool.uv.workspace]
members = ["packages/eqpit"]

[tool.uv.sources]
eqpit = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "packages/eqpit/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/efp", "packages/eqpit/src/eqpit"]
mypy_path = ["src", "packages/eqpit/src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "exchange_calendars.*",
    "linearmodels.*",
    "numba.*",
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "packages/eqpit/tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["tests/unit", "tests/leakage"]
markers = [
    "data: needs licensed raw data",
    "network: needs live EDGAR or French access",
    "bench: benchmarks",
    "leakage: point-in-time leakage checks (required CI check)",
    "slow: slower tests",
]

[tool.coverage.run]
branch = false
source_pkgs = ["efp", "eqpit"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']
