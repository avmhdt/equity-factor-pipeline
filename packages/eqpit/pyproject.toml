[project]
name = "eqpit"
version = "0.1.0"
description = "Point-in-time US equity data layer: every row carries the time it became public."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "polars>=1.9",
    "pyarrow>=17",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "exchange-calendars>=4.5",
    "structlog>=24.1",
]

[project.optional-dependencies]
wrds = ["wrds>=3.1"]
free = ["yfinance>=0.2.40"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqpit"]
